name: Release

# Push a tag like v1.0.1 (matching package.json) to publish:
#   - a GitHub Release with the .mcpb extension attached (one-click install in Claude Desktop)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run pack

      - uses: softprops/action-gh-release@v2
        with:
          files: search-console-oauth-mcp-*.mcpb
          generate_release_notes: true

